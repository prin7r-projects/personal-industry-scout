services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-industry-scout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pis
      POSTGRES_PASSWORD: pis_dev
      POSTGRES_DB: pis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pis -d pis"]
      interval: 5s
      timeout: 3s
      retries: 5

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: personal-industry-scout-landing:latest
    container_name: personal-industry-scout-landing
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personal-industry-scout.rule=Host(`personal-industry-scout.prin7r.com`)"
      - "traefik.http.routers.personal-industry-scout.entrypoints=websecure"
      - "traefik.http.routers.personal-industry-scout.tls.certresolver=letsencrypt"
      - "traefik.http.services.personal-industry-scout.loadbalancer.server.port=3000"

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile.app
    image: personal-industry-scout-app:latest
    container_name: personal-industry-scout-app
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personal-industry-scout-app.rule=Host(`app.personal-industry-scout.prin7r.com`)"
      - "traefik.http.routers.personal-industry-scout-app.entrypoints=websecure"
      - "traefik.http.routers.personal-industry-scout-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.personal-industry-scout-app.loadbalancer.server.port=3001"

  # Workers — not scheduled inside the container; triggered via cron on host or orchestrator.
  worker-sync-notion:
    build:
      context: .
      dockerfile: Dockerfile.worker-sync-notion
    image: personal-industry-scout-worker-sync-notion:latest
    container_name: personal-industry-scout-worker-sync-notion
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - workers

  worker-deliver:
    build:
      context: .
      dockerfile: Dockerfile.worker-deliver
    image: personal-industry-scout-worker-deliver:latest
    container_name: personal-industry-scout-worker-deliver
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - workers

  worker-tender-intake:
    build:
      context: .
      dockerfile: Dockerfile.worker-tender-intake
    image: personal-industry-scout-worker-tender-intake:latest
    container_name: personal-industry-scout-worker-tender-intake
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - workers

  worker-scout-signals:
    build:
      context: .
      dockerfile: Dockerfile.worker-scout-signals
    image: personal-industry-scout-worker-scout-signals:latest
    container_name: personal-industry-scout-worker-scout-signals
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - workers

volumes:
  pgdata:
